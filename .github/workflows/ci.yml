name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, dev, "feature/**"]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:8.0
        # L'inscription crée entreprise + utilisateur dans une transaction MongoDB.
        command: mongod --replSet rs0 --bind_ip_all
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'try { if (db.hello().isWritablePrimary) quit(0) } catch (e) {} try { rs.initiate({_id: \"rs0\", members: [{_id: 0, host: \"127.0.0.1:27017\"}]}) } catch (e) {} quit(1)'"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      MONGO_URI_TEST: mongodb://127.0.0.1:27017/carlog_pro_ci?replicaSet=rs0
      JWT_SECRET: ci-${{ github.run_id }}-${{ github.run_attempt }}-test-only
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test -- --runInBand

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
